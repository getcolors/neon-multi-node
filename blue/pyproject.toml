[project]
name = "package-neon-multi-node-blue"
version = "0.1.0"
description = "Blue/Python implementation of the neon-multi-node package"
requires-python = ">=3.11"
dependencies = [
    "blue",
    "colors-compute-blue @ git+https://github.com/getcolors/colors-compute.git@ae28ea74962bb1897fa6365c143c1d43ac1fe095#subdirectory=blue",
    "package-once-blue @ git+https://github.com/getcolors/once.git@10e525ae7c37130ab4d532b91c8d2ead94557cc8#subdirectory=blue",
    "package-neon-blue @ git+https://github.com/getcolors/neon.git@9f8ccc18e218ea3b6ce293a470afd61b19e81639#subdirectory=blue",
]

[tool.uv.sources]
colors-compute-blue = { git = "https://github.com/getcolors/colors-compute.git", subdirectory = "blue", rev = "ae28ea74962bb1897fa6365c143c1d43ac1fe095" }
blue = { git = "https://github.com/getcolors/blue.git", rev = "e29a7fc5a7a2895eacb882fc65520c2cdbab96c9" }
package-once-blue = { git = "https://github.com/getcolors/once.git", subdirectory = "blue", rev = "10e525ae7c37130ab4d532b91c8d2ead94557cc8" }
package-neon-blue = { git = "https://github.com/getcolors/neon.git", subdirectory = "blue", rev = "9f8ccc18e218ea3b6ce293a470afd61b19e81639" }

[tool.uv]
override-dependencies = [
    "blue @ git+https://github.com/getcolors/blue.git@e29a7fc5a7a2895eacb882fc65520c2cdbab96c9",
    "package-once-blue @ git+https://github.com/getcolors/once.git@10e525ae7c37130ab4d532b91c8d2ead94557cc8#subdirectory=blue",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.build.targets.wheel]
packages = ["src/package_neon_multi_node_blue"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
